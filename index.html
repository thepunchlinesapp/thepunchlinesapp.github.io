<style>

  h1 {

    padding:0 8px;

  .cta small {

  .point { margin:0 .4em; opacity:.6; }

  /* ---------- Pied de page : le plus discret possible ---------- */

  }

<script>
  // Bascule de langue : le bouton affiche toujours l'autre langue
  (function () {
    var noms = { fr: 'Français', en: 'English' };
    var bouton = document.getElementById('langue');

    function actualiser() {
      var actuelle = document.documentElement.getAttribute('lang') === 'en' ? 'en' : 'fr';
      var autre = actuelle === 'fr' ? 'en' : 'fr';
      bouton.textContent = noms[autre];
      bouton.setAttribute('data-vers', autre);
      bouton.setAttribute('lang', autre);
    }

    bouton.addEventListener('click', function () {
      var vers = bouton.getAttribute('data-vers');
      if (window.switchLanguage) window.switchLanguage(vers);
      setTimeout(actualiser, 60);
    });

    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(actualiser, 250);
    });
    actualiser();
  })();
</script>
